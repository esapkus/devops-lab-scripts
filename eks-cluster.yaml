apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devops-eks-prodstyle
  region: us-east-1
  version: "1.34"
  tags:
    Project: devops-eks
    Environment: lab
    ManagedBy: eksctl

iam:
  withOIDC: true

vpc:
  cidr: 192.168.0.0/16
  nat:
    gateway: Single
  clusterEndpoints:
    publicAccess: true
    privateAccess: false

managedNodeGroups:
  - name: devops-workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 30
    volumeType: gp3
    privateNetworking: true
    labels:
      role: worker
      environment: lab
    tags:
      Project: devops-eks
      Environment: lab
      ManagedBy: eksctl
